# golangci-lint configuration for kfa.
# Run locally with: golangci-lint run
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - errcheck       # unchecked errors
    - govet          # vet
    - ineffassign    # ineffectual assignments
    - misspell       # common spelling mistakes
    - revive         # style/lint rules
    - staticcheck    # advanced static analysis
    - unconvert      # unnecessary conversions
    - unparam        # unused function params
    - unused         # unused code
    - bodyclose      # HTTP response bodies must be closed
    - errorlint      # correct errors.Is/As and %w usage
    - rowserrcheck   # sql.Rows.Err() must be checked
    - sqlclosecheck  # sql.Rows/Stmt must be closed
  settings:
    misspell:
      locale: US
  exclusions:
    rules:
      # Test files may be a little looser.
      - path: _test\.go
        linters:
          - errcheck
          - unparam

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # Must be this project's own module path, so its imports group last.
      # This is the line most often left pointing at the wrong project.
      local-prefixes:
        - github.com/shindakun/additional-1-and-2-translation-research
